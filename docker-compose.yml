services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: zhkh_tickets
      POSTGRES_USER: zhkh
      POSTGRES_PASSWORD: zhkh
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhkh -d zhkh_tickets"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: zhkh_tickets
      POSTGRES_USER: zhkh
      POSTGRES_PASSWORD: zhkh
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
