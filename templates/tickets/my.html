{% extends "base.html" %}
{% block title %}Мои заявки{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Мои заявки</h1>
  <a class="btn btn-primary" href="{% url 'tickets:create' %}">Новая заявка</a>
</div>
<form method="get" class="row g-2 mb-3">
  <div class="col-sm-4">{{ form.status }}</div>
  <div class="col-sm-4">{{ form.q }}</div>
  <div class="col-sm-4"><button class="btn btn-outline-primary">Найти</button></div>
</form>
{% include "tickets/_table.html" with empty_text="У вас нет заявок" %}
{% endblock %}
