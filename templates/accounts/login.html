{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <h1 class="h3 mb-3">Вход</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% for error in form.non_field_errors %}<div class="alert alert-danger">{{ error }}</div>{% endfor %}
    {% for field in form %}{% include "_field.html" %}{% endfor %}
    <button class="btn btn-primary" type="submit">Войти</button>
  </form>
  <p class="mt-3 mb-0"><a href="{% url 'accounts:register' %}">Регистрация</a> ·
    <a href="{% url 'accounts:password_reset' %}">Восстановить пароль</a></p>
</div></div>
{% endblock %}
